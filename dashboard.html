<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giám sát Vườn Cây Công Nghiệp (Cà phê / Hồ tiêu)</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f3; margin: 20px; color: #333; }
    h1 { text-align: center; color: #1b5e20; }
    .status { text-align: center; font-weight: bold; margin-bottom: 20px; color: #d84315; }
    .dashboard { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; text-align: center; }
    .sensor-val { font-size: 42px; font-weight: bold; margin: 15px 0; color: #0277bd; }
    .hum-val { color: #00897b; }
    button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn-off { background: #e0e0e0; color: #333; }
    .btn-on { background: #2e7d32; color: #fff; }
    .charts { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
    .chart-box { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 450px; }
  </style>
</head>
<body>

  <h1>HỆ THỐNG GIÁM SÁT VƯỜN CÀ PHÊ & HỒ TIÊU</h1>
  <div id="conn-status" class="status">Đang kết nối MQTT Broker...</div>

  <!-- 2 THẺ HTML CLASS HIỂN THỊ DỮ LIỆU SỐ & 2 NÚT BUTTON ĐIỀU KHIỂN -->
  <div class="dashboard">
    <div class="card">
      <h3>NHIỆT ĐỘ MÔI TRƯỜNG</h3>
      <div class="sensor-val temp-display" id="temp-val">-- °C</div>
    </div>

    <div class="card">
      <h3>ĐỘ ẨM KHÔNG KHÍ</h3>
      <div class="sensor-val hum-val hum-display" id="hum-val">-- %</div>
      <small>Ngưỡng chuẩn: 40% - 60%</small>
    </div>

    <div class="card">
      <h3>ĐIỀU KHIỂN THIẾT BỊ (MANUAL)</h3>
      <button id="btn-pump" class="btn-off" onclick="toggleDevice('pump')">MÁY BƠM: ĐANG TẮT</button>
      <button id="btn-fan" class="btn-off" onclick="toggleDevice('fan')">QUẠT GIÓ: ĐANG TẮT</button>
    </div>
  </div>

  <!-- 2 BIỂU ĐỒ THỜI GIAN THỰC -->
  <div class="charts">
    <div class="chart-box"><canvas id="tempChart"></canvas></div>
    <div class="chart-box"><canvas id="humChart"></canvas></div>
  </div>

  <script>
    // Cấu hình MQTT qua WebSocket
    const brokerUrl = 'wss://broker.hivemq.com:8884/mqtt';
    
    // QUAN TRỌNG: Đổi chữ 'nhom1' ở 3 dòng dưới đây cho giống hệt với code trên Wokwi của bạn
    const topicSensor = 'vuon_cong_nghiep/nhom1/data';
    const topicPump = 'vuon_cong_nghiep/nhom1/control/pump';
    const topicFan = 'vuon_cong_nghiep/nhom1/control/fan';

    let pumpState = false;
    let fanState = false;

    // Khởi tạo biểu đồ Chart.js
    const createChart = (ctx, label, color) => new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: label, data: [], borderColor: color, tension: 0.3, fill: false }] },
      options: { responsive: true, scales: { y: { beginAtZero: false } } }
    });
    const tempChart = createChart(document.getElementById('tempChart'), 'Nhiệt độ (°C)', '#e53935');
    const humChart = createChart(document.getElementById('humChart'), 'Độ ẩm (%)', '#00897b');

    function updateChart(chart, timeLabel, value) {
      if (chart.data.labels.length > 15) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.data.labels.push(timeLabel);
      chart.data.datasets[0].data.push(value);
      chart.update();
    }

    // Kết nối MQTT
    const client = mqtt.connect(brokerUrl);

    client.on('connect', () => {
      document.getElementById('conn-status').innerText = 'Đã kết nối MQTT Broker thành công!';
      document.getElementById('conn-status').style.color = '#2e7d32';
      client.subscribe(topicSensor);
    });

    client.on('message', (topic, message) => {
      if (topic === topicSensor) {
        const data = JSON.parse(message.toString());
        document.querySelector('.temp-display').innerText = data.temp.toFixed(1) + ' °C';
        document.querySelector('.hum-display').innerText = data.hum.toFixed(1) + ' %';

        const now = new Date().toLocaleTimeString();
        updateChart(tempChart, now, data.temp);
        updateChart(humChart, now, data.hum);
      }
    });

    // Hàm gửi lệnh điều khiển khi nhấn Button
    function toggleDevice(device) {
      if (device === 'pump') {
        pumpState = !pumpState;
        const btn = document.getElementById('btn-pump');
        btn.innerText = pumpState ? 'MÁY BƠM: ĐANG BẬT' : 'MÁY BƠM: ĐANG TẮT';
        btn.className = pumpState ? 'btn-on' : 'btn-off';
        client.publish(topicPump, pumpState ? 'ON' : 'OFF');
      } else if (device === 'fan') {
        fanState = !fanState;
        const btn = document.getElementById('btn-fan');
        btn.innerText = fanState ? 'QUẠT GIÓ: ĐANG BẬT' : 'QUẠT GIÓ: ĐANG TẮT';
        btn.className = fanState ? 'btn-on' : 'btn-off';
        client.publish(topicFan, fanState ? 'ON' : 'OFF');
      }
    }
  </script>
</body>
</html>
